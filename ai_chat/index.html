<button class="chatbot-toggler">
    <span><i class="fas fa-message fa-xl"></i></span>
    <span ><i class="fas fa-close fa-xl"></i></span>
</button>
<div class="chatbot">
    <header>
        <h4>Ask Me!</h4>
        <span class="status-msg"></span>
        <span class="download-icon" data-tooltip="Download Chat" data-tooltip-position="bottom">
            <i class="fas fa-download fa-xl"></i>
        </span>
        <span class="sync-icon" data-tooltip="Sync folder with Vector Store" data-tooltip-position="bottom">
            <button class="btn btn-xs btn-primaryrc btn-primaryrc-light"><i class="fas fa-cloud-upload fa-sm"></i> Sync</button>
        </span>
        <span class="menu-icon" data-tooltip="View list of files" data-tooltip-position="bottom">
            <i class="fas fa-list fa-xl"></i>
        </span>
        <div class="dropdown-menu">

        </div>
        <span class="close-btn" data-tooltip="Close" data-tooltip-position="bottom"><i class="fas fa-close fa-xl"></i></span>
    </header>
    <div class="div-settings" style="float: left; width: 520px; padding: 10px; border-bottom: 1px dashed #000; display: none;">
        <div style="font-weight: bold; float: left;padding-left: 10px;">Select Setup:</div>
        <div style="padding-left: 10px; float: left;">
            <select id="setting-sel" class="x-form-text x-form-field fs11">

            </select>
        </div>
    </div>
    <ul class="chatbox">
        <li class="chat incoming">
            <span><i class="fas fa-robot"></i></span>
            <div>Hi there <br>How can I help you today?</div>
        </li>
    </ul>
    <div class="chat-input">
        <textarea placeholder="Enter a question..." spellcheck="true" required></textarea>
        <span id="send-btn"><i class="fas fa-arrow-alt-circle-up"></i></span>
    </div>
</div>
